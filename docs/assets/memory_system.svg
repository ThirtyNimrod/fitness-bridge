<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="grad_st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="grad_lt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="grad_sem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8" />
    </marker>
  </defs>

  <rect width="800" height="400" rx="16" fill="#0F172A" />

  <!-- Connector Lines -->
  <path d="M220 200 H280" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M480 200 H540" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Flow Lines (Input/Output) -->
  <path d="M40 200 H80" stroke="#6366F1" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)" />
  <path d="M720 200 H760" stroke="#EC4899" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)" />

  <!-- Tier 1: Short-Term Memory -->
  <g filter="url(#shadow)">
    <rect x="80" y="140" width="140" height="120" rx="12" fill="url(#grad_st)" />
    <text x="150" y="175" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Short-Term</text>
    <text x="150" y="200" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Recent Context</text>
    <text x="150" y="215" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Last 10 Messages</text>
  </g>

  <!-- Tier 2: Long-Term Memory -->
  <g filter="url(#shadow)">
    <rect x="280" y="140" width="200" height="120" rx="12" fill="url(#grad_lt)" />
    <text x="380" y="175" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Long-Term</text>
    <text x="380" y="200" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Historical Workouts</text>
    <text x="380" y="215" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">RAG / Vector Stores</text>
  </g>

  <!-- Tier 3: Semantic Memory -->
  <g filter="url(#shadow)">
    <rect x="540" y="140" width="180" height="120" rx="12" fill="url(#grad_sem)" />
    <text x="630" y="175" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="bold" font-size="16">Semantic</text>
    <text x="630" y="200" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Fitness Knowledge</text>
    <text x="630" y="215" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Logic / Rules / DB</text>
  </g>

  <!-- Labels -->
  <text x="400" y="60" text-anchor="middle" fill="#F1F5F9" font-family="Inter, sans-serif" font-bold="800" font-size="28">The Fitness Bridge Memory System</text>
  <text x="40" y="190" fill="#6366F1" font-family="Inter, sans-serif" font-size="11" font-weight="bold">QUERY</text>
  <text x="730" y="190" fill="#EC4899" font-family="Inter, sans-serif" font-size="11" font-weight="bold">RELEVANCE</text>
</svg>
